<!DOCTYPE html>

<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Interactive Image Gallery</title>

<style>
    /* General Styling */
    body {
        margin: 0;
        padding: 25px;
        background-color: #121212;
        font-family: Arial, sans-serif;
        text-align: center;
        color: white;
    }

    h1 {
        color: #ffffff;
        margin-bottom: 25px;
    }

    /* Image Grid */
    .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        max-width: 1100px;
        margin: auto;
    }

    /* Gallery Images */
    .gallery img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 10px;
        cursor: pointer;
        transition: transform 0.3s, box-shadow 0.3s;
    }

    /* Hover Effect */
    .gallery img:hover {
        transform: scale(1.05);
        box-shadow: 0 5px 20px rgba(139, 92, 246, 0.6);
    }

    /* Start Slideshow Button */
    .start-btn {
        margin-top: 30px;
        padding: 12px 25px;
        background-color: #8b5cf6;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    .start-btn:hover {
        background-color: #6d28d9;
    }

    /* Slideshow Overlay */
    .slideshow {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.95);
        justify-content: center;
        align-items: center;
        z-index: 10;
    }

    /* Large Slideshow Image */
    .slideshow img {
        max-width: 85%;
        max-height: 80vh;
        object-fit: contain;
        border-radius: 8px;
    }

    /* Slideshow Control Buttons */
    .slide-btn {
        position: absolute;
        background: #8b5cf6;
        color: white;
        border: none;
        padding: 12px 16px;
        font-size: 18px;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s;
        
    }

    .slide-btn:hover {
        background: #6d28d9;
    }

    /* Close Button */
    .close {
        top: 20px;
        right: 20px;
    }

    /* Previous Button */
    .prev {
        left: 20px;
    }

    /* Next Button */
    .next {
        right: 20px;
    }

    /* Pause/Play Button */
    .pause {
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
    }

    /* Mobile Responsive Design */
    @media (max-width: 600px) {
        body {
            padding: 15px;
        }

        .gallery {
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .gallery img {
            height: 150px;
        }

        .slideshow img {
            max-width: 75%;
            max-height: 70vh;
        }

        .slide-btn {
            padding: 10px 12px;
            font-size: 16px;
        }

        .prev {
            left: 5px;
        }

        .next {
            right: 5px;
        }

        .close {
            top: 10px;
            right: 10px;
        }
    }
</style>


</head>

<body>

<h1>Image Gallery</h1>

<!-- Image Gallery -->
<div class="gallery">

    <img src="https://picsum.photos/id/1015/600/400"
         alt="Mountain landscape"
         onclick="openSlide(0)">

    <img src="https://picsum.photos/id/1016/600/400"
         alt="Forest scenery"
         onclick="openSlide(1)">

    <img src="https://picsum.photos/id/1020/600/400"
         alt="Wildlife"
         onclick="openSlide(2)">

    <img src="https://picsum.photos/id/1039/600/400"
         alt="Beautiful landscape"
         onclick="openSlide(3)">

    <img src="https://picsum.photos/id/1043/600/400"
         alt="Nature scenery"
         onclick="openSlide(4)">

    <img src="https://picsum.photos/id/1050/600/400"
         alt="Scenic view"
         onclick="openSlide(5)">

</div>

<!-- Start Slideshow Button -->
<button class="start-btn" onclick="startSlideshow()">
    ▶ Start Slideshow
</button>

<!-- Slideshow Window -->
<div class="slideshow" id="slideshow">

    <!-- Close Button -->
    <button class="slide-btn close"
            onclick="closeSlide()"
            aria-label="Close slideshow">
        ✖
    </button>

    <!-- Previous Button -->
    <button class="slide-btn prev"
            onclick="changeSlide(-1)"
            aria-label="Previous image">
        ❮
    </button>

    <!-- Current Slideshow Image -->
    <img id="slideImage" src="" alt="Slideshow image">

    <!-- Next Button -->
    <button class="slide-btn next"
            onclick="changeSlide(1)"
            aria-label="Next image">
        ❯
    </button>

    <!-- Pause/Resume Button -->
    <button class="slide-btn pause"
            id="pauseBtn"
            onclick="toggleSlideshow()">
        ⏸ Pause
    </button>

</div>

<script>
    // Get all gallery images
    const images = document.querySelectorAll(".gallery img");

    // Get slideshow elements
    const slideshow = document.getElementById("slideshow");
    const slideImage = document.getElementById("slideImage");
    const pauseBtn = document.getElementById("pauseBtn");

    // Current image index
    let currentIndex = 0;

    // Auto-play timer
    let slideTimer = null;

    // Auto-play interval in milliseconds
    const slideInterval = 3000;

    // Display a specific image
    function showSlide(index) {
        currentIndex = (index + images.length) % images.length;

        slideImage.src = images[currentIndex].src;
        slideImage.alt = images[currentIndex].alt;
    }

    // Open slideshow at the selected image
    function openSlide(index) {
        stopAutoPlay();

        slideshow.style.display = "flex";
        showSlide(index);

        pauseBtn.textContent = "▶ Play";
    }

    // Start automatic slideshow
    function startSlideshow() {
        slideshow.style.display = "flex";
        showSlide(currentIndex);

        startAutoPlay();
    }

    // Move to the next or previous image
    function changeSlide(direction) {
        showSlide(currentIndex + direction);
    }

    // Start auto-play timer
    function startAutoPlay() {
        stopAutoPlay();

        slideTimer = setInterval(function () {
            changeSlide(1);
        }, slideInterval);

        pauseBtn.textContent = "⏸ Pause";
    }

    // Stop auto-play timer
    function stopAutoPlay() {
        if (slideTimer !== null) {
            clearInterval(slideTimer);
            slideTimer = null;
        }

        pauseBtn.textContent = "▶ Play";
    }

    // Pause or resume the slideshow
    function toggleSlideshow() {
        if (slideTimer !== null) {
            stopAutoPlay();
        } else {
            startAutoPlay();
        }
    }

    // Close slideshow
    function closeSlide() {
        slideshow.style.display = "none";
        stopAutoPlay();
    }

    // Close slideshow when clicking outside the image
    slideshow.addEventListener("click", function (event) {
        if (event.target === slideshow) {
            closeSlide();
        }
    });

    // Navigate using keyboard arrow keys
    document.addEventListener("keydown", function (event) {
        if (slideshow.style.display !== "flex") {
            return;
        }

        if (event.key === "ArrowRight") {
            changeSlide(1);
        } else if (event.key === "ArrowLeft") {
            changeSlide(-1);
        } else if (event.key === "Escape") {
            closeSlide();
        } else if (event.code === "Space") {
            event.preventDefault();
            toggleSlideshow();
        }
    });
</script>


</body> </html>
